<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>AR Heart — MeWorld</title>
	<!-- include three.js library -->
	<script src='js/three.js'></script>
	<!-- include jsartookit -->
	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>
	<!-- include threex.artoolkit -->
	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
</head>

<body style='margin : 0px; overflow: hidden; font-family: Monospace;'>

<!-- 
  Example created by Lee Stemkoski: https://github.com/stemkoski
  Based on the AR.js library and examples created by Jerome Etienne: https://github.com/jeromeetienne/AR.js/
-->

<script>

var scene, camera, renderer, clock, deltaTime, totalTime;

var arToolkitSource, arToolkitContext;

var markerRoot1, markerRoot2;

var mesh1;

initialize();
animate();

function initialize()
{
	scene = new THREE.Scene();

	let ambientLight = new THREE.AmbientLight( 0xcccccc, 0.5 );
	scene.add( ambientLight );
				
	camera = new THREE.Camera();
	scene.add(camera);

	renderer = new THREE.WebGLRenderer({
		antialias : true,
		alpha: true
	});
	renderer.setClearColor(new THREE.Color('lightgrey'), 0)
	renderer.setSize( 640, 480 );
	renderer.domElement.style.position = 'absolute'
	renderer.domElement.style.top = '0px'
	renderer.domElement.style.left = '0px'
	document.body.appendChild( renderer.domElement );

	clock = new THREE.Clock();
	deltaTime = 0;
	totalTime = 0;
	
	////////////////////////////////////////////////////////////
	// setup arToolkitSource
	////////////////////////////////////////////////////////////

	arToolkitSource = new THREEx.ArToolkitSource({
		sourceType : 'webcam',
	});

	function onResize()
	{
		arToolkitSource.onResize()	
		arToolkitSource.copySizeTo(renderer.domElement)	
		if ( arToolkitContext.arController !== null )
		{
			arToolkitSource.copySizeTo(arToolkitContext.arController.canvas)	
		}	
	}

	arToolkitSource.init(function onReady(){
		onResize()
	});
	
	// handle resize event
	window.addEventListener('resize', function(){
		onResize()
	});
	
	////////////////////////////////////////////////////////////
	// setup arToolkitContext
	////////////////////////////////////////////////////////////	

	// create atToolkitContext
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl: 'data/camera_para.dat',
		detectionMode: 'mono'
	});
	
	// copy projection matrix to camera when initialization complete
	arToolkitContext.init( function onCompleted(){
		camera.projectionMatrix.copy( arToolkitContext.getProjectionMatrix() );
	});

	////////////////////////////////////////////////////////////
	// setup markerRoots
	////////////////////////////////////////////////////////////

	// build markerControls
	markerRoot1 = new THREE.Group();
	scene.add(markerRoot1);
	let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
		type: 'pattern', patternUrl: "data/hiro.patt",
	})

	// 3D anatomical heart (group of spheres + vessels)
	let heartGroup = new THREE.Group();
	let heartMat = new THREE.MeshNormalMaterial({
		transparent: true,
		opacity: 0.7,
		side: THREE.DoubleSide
	});
	
	// Left ventricle bulge
	let s1 = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), heartMat);
	s1.position.set(0.12, 0, 0.05);
	s1.scale.set(0.9, 1.1, 0.8);
	heartGroup.add(s1);
	
	// Right ventricle bulge
	let s2 = new THREE.Mesh(new THREE.SphereGeometry(0.30, 24, 24), heartMat);
	s2.position.set(-0.10, 0.02, -0.04);
	s2.scale.set(0.85, 1.05, 0.78);
	heartGroup.add(s2);
	
	// Main body fill
	let s3 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), heartMat);
	s3.position.set(0, -0.02, 0);
	s3.scale.set(0.92, 0.9, 0.85);
	heartGroup.add(s3);
	
	// Aorta (top vessel)
	let aorta = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.35, 16), heartMat);
	aorta.position.set(0.03, 0.55, 0.02);
	aorta.rotation.z = 0.2;
	heartGroup.add(aorta);
	
	// Pulmonary artery
	let pa = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.28, 12), heartMat);
	pa.position.set(-0.06, 0.45, 0.06);
	pa.rotation.z = -0.25;
	heartGroup.add(pa);
	
	// IVC
	let ivc = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.20, 12), heartMat);
	ivc.position.set(-0.05, -0.42, 0);
	heartGroup.add(ivc);
	
	heartGroup.position.y = 0.5;
	heartGroup.scale.set(0.8, 0.8, 0.8);
	
	markerRoot1.add( heartGroup );
}


function update()
{
	// update artoolkit on every frame
	if ( arToolkitSource.ready !== false )
		arToolkitContext.update( arToolkitSource.domElement );
}


function render()
{
	renderer.render( scene, camera );
}


function animate()
{
	requestAnimationFrame(animate);
	deltaTime = clock.getDelta();
	totalTime += deltaTime;
	update();
	render();
}

</script>

</body>
</html>
