<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>Hello, AR Heart!</title>
	<!-- include three.js library -->
	<script src='js/three.js'></script>
	<!-- include OBJLoader for the heart model -->
	<script src="js/OBJLoader.js"></script>
	<!-- include jsartookit -->
	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>
	<!-- include threex.artoolkit -->
	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
	<script src="threex/threex-arsmoothedcontrols.js"></script>
</head>

<body style='margin : 0px; overflow: hidden; font-family: Monospace;'>

<!--
  Based on Lee Stemkoski's hello-cube.html and smoothed-controls.html:
  https://github.com/stemkoski/AR-Examples
  
  Changes from hello-cube.html:
    1. Real 3D heart model (101k faces, OBJ) via OBJLoader
    2. SmoothedControls wrapping markerRoot1 (lerp 0.2/0.15) to kill jitter
    3. One-finger drag = rotate, two-finger pinch = zoom (0.3x–4.0x range)
    4. Fullscreen canvas with retina pixel ratio (max 2x) for sharp rendering
    5. Camera source bumped to 960×720 for better marker coverage
    6. MeshPhongMaterial with directional + ambient light
    7. Heart stands upright — aorta points up from marker surface
  Everything else is untouched stemkoski scaffolding.
-->

<script>

var scene, camera, renderer, clock, deltaTime, totalTime;

var arToolkitSource, arToolkitContext, smoothedControls;

var markerRoot1;

var mesh1;

initialize();
animate();

function initialize()
{
	scene = new THREE.Scene();

	let ambientLight = new THREE.AmbientLight( 0xcccccc, 0.5 );
	scene.add( ambientLight );

	let directionalLight = new THREE.DirectionalLight( 0xffffff, 0.6 );
	directionalLight.position.set(0, 1, 1);
	scene.add(directionalLight);
				
	camera = new THREE.Camera();
	scene.add(camera);

	renderer = new THREE.WebGLRenderer({
		antialias : true,
		alpha: true
	});
	renderer.setClearColor(new THREE.Color('lightgrey'), 0)
	renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
	renderer.setSize( window.innerWidth, window.innerHeight );
	renderer.domElement.style.position = 'absolute'
	renderer.domElement.style.top = '0px'
	renderer.domElement.style.left = '0px'
	// prevent the browser from scrolling/zooming while dragging on the canvas
	renderer.domElement.style.touchAction = 'none'
	document.body.appendChild( renderer.domElement );

	clock = new THREE.Clock();
	deltaTime = 0;
	totalTime = 0;
	
	////////////////////////////////////////////////////////////
	// setup arToolkitSource
	////////////////////////////////////////////////////////////

	arToolkitSource = new THREEx.ArToolkitSource({
		sourceType : 'webcam',
		sourceWidth  : 960,
		sourceHeight : 720,
	});

	function onResize()
	{
		arToolkitSource.onResize()	
		arToolkitSource.copySizeTo(renderer.domElement)	
		if ( arToolkitContext.arController !== null )
		{
			arToolkitSource.copySizeTo(arToolkitContext.arController.canvas)	
		}	
	}

	arToolkitSource.init(function onReady(){
		onResize()
	});
	
	// handle resize event
	window.addEventListener('resize', function(){
		onResize()
	});
	
	////////////////////////////////////////////////////////////
	// setup arToolkitContext
	////////////////////////////////////////////////////////////	

	// create atToolkitContext
	arToolkitContext = new THREEx.ArToolkitContext({
		cameraParametersUrl: 'data/camera_para.dat',
		detectionMode: 'mono'
	});
	
	// copy projection matrix to camera when initialization complete
	arToolkitContext.init( function onCompleted(){
		camera.projectionMatrix.copy( arToolkitContext.getProjectionMatrix() );
	});

	////////////////////////////////////////////////////////////
	// setup markerRoots
	////////////////////////////////////////////////////////////

	// build markerControls
	markerRoot1 = new THREE.Group();
	scene.add(markerRoot1);
	let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
		type: 'pattern', patternUrl: "data/hiro.patt",
	})

	// interpolates from last position to create smoother transitions when moving.
	// parameter lerp values near 0 are slow, near 1 are fast (instantaneous).
	// Using 0.2/0.15 — smooth enough to kill jitter, snappy enough to not lag.
	let smoothedRoot = new THREE.Group();
	scene.add(smoothedRoot);
	smoothedControls = new THREEx.ArSmoothedControls(smoothedRoot, {
		lerpPosition: 0.2,
		lerpQuaternion: 0.15,
		lerpScale: 1,
	});

	// ---- load real 3D heart model ----
	// Heart material: anatomical reddish with some translucency
	var heartMaterial = new THREE.MeshPhongMaterial({
		color: 0x3366cc,
		specular: 0x224488,
		shininess: 30,
		transparent: true,
		opacity: 0.85,
		side: THREE.DoubleSide
	});

	var loader = new THREE.OBJLoader();
	loader.load('heart_low.obj', function(object) {
		mesh1 = object;
		// Center and size the heart above the marker
		mesh1.position.y = 0.5;
		// Stand upright — aorta points up from marker surface
		mesh1.rotation.x = -Math.PI / 2;
		// Scale to fit marker area (~2 units across)
		var bbox = new THREE.Box3().setFromObject(mesh1);
		var size = bbox.getSize();
		var maxDim = Math.max(size.x, size.y, size.z);
		if (maxDim > 0) {
			baseScale = 1.8 / maxDim;
			mesh1.scale.set(baseScale, baseScale, baseScale);
		}
		// Apply material to all children
		mesh1.traverse(function(child) {
			if (child instanceof THREE.Mesh) child.material = heartMaterial;
		});
		// Parent to smoothed root AFTER load completes
		smoothedRoot.add(mesh1);
	});
	// ---- end heart model ----

	////////////////////////////////////////////////////////////
	// touch interaction: one finger rotates, two fingers pinch-zoom
	////////////////////////////////////////////////////////////
	let state = 'idle'; // idle | rotate | pinch
	let lastPinchDist = 0;
	let baseScale = 1.0; // accumulated scale from all pinch gestures
	let prevTouch1 = { x: 0, y: 0 };
	let rotateSpeed = 0.015;
	let zoomSpeed = 0.005;

	renderer.domElement.addEventListener('touchstart', function(event){
		if (event.touches.length === 1) {
			state = 'rotate';
			prevTouch1.x = event.touches[0].clientX;
			prevTouch1.y = event.touches[0].clientY;
		} else if (event.touches.length === 2) {
			state = 'pinch';
			let dx = event.touches[0].clientX - event.touches[1].clientX;
			let dy = event.touches[0].clientY - event.touches[1].clientY;
			lastPinchDist = Math.sqrt(dx * dx + dy * dy);
		}
	});

	renderer.domElement.addEventListener('touchmove', function(event){
		event.preventDefault();
		if (!mesh1) return;

		if (state === 'rotate' && event.touches.length === 1) {
			let deltaX = event.touches[0].clientX - prevTouch1.x;
			let deltaY = event.touches[0].clientY - prevTouch1.y;
			mesh1.rotation.y += deltaX * rotateSpeed;
			mesh1.rotation.x += deltaY * rotateSpeed;
			prevTouch1.x = event.touches[0].clientX;
			prevTouch1.y = event.touches[0].clientY;
		} else if (state === 'pinch' && event.touches.length === 2) {
			let dx = event.touches[0].clientX - event.touches[1].clientX;
			let dy = event.touches[0].clientY - event.touches[1].clientY;
			let newDist = Math.sqrt(dx * dx + dy * dy);
			let delta = (newDist - lastPinchDist) * zoomSpeed;
			baseScale += delta;
			baseScale = Math.max(0.3, Math.min(4.0, baseScale)); // clamp zoom range
			// Read current tracked scale from smoothedRoot to compose
			var trackedScale = smoothedRoot.scale.x; // uniform from marker
			mesh1.scale.set(baseScale, baseScale, baseScale);
			lastPinchDist = newDist;
		}
	}, { passive: false });

	renderer.domElement.addEventListener('touchend', function(event){
		state = 'idle';
	});
}


function update()
{
	// update artoolkit on every frame
	if ( arToolkitSource.ready !== false )
		arToolkitContext.update( arToolkitSource.domElement );

	// additional code for smoothed controls
	smoothedControls.update(markerRoot1);
}


function render()
{
	renderer.render( scene, camera );
}


function animate()
{
	requestAnimationFrame(animate);
	deltaTime = clock.getDelta();
	totalTime += deltaTime;
	update();
	render();
}

</script>

</body>
</html>
